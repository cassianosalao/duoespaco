    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <style>
      /* Oculta imediatamente qualquer badge, drawer, HUD ou marca injetada pela Netlify */
      #nl-hud-frame,
      #nl-badge-frame,
      iframe[title="Powered by Netlify"],
      iframe[title="Netlify"],
      iframe[id*="nl-"],
      iframe[src*="netlify"],
      netlify-badge,
      netlify-drawer,
      netlify-feedback,
      [class*="netlify"],
      [id*="netlify"],
      [id*="nl-"],
      [data-netlify-badge],
      a[href*="netlify.com"],
      div:has(> a[href*="netlify.com"]),
      div:has(> [class*="netlify"]),
      div:has(> netlify-badge),
      div:has(> netlify-drawer) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -99999px !important;
        top: -99999px !important;
        clip-path: circle(0) !important;
        z-index: -99999 !important;
      }
    </style>
    <script>
      (function() {
        // 1. Armazena estado hidden no localStorage
        try {
          localStorage.setItem('nl-hud:public:v1', 'hidden');
          localStorage.setItem('nl-hud:owner-private:v1', 'hidden');
        } catch(e) {}

        // 2. Intercepta getElementById para fazer o script oficial da Netlify encerrar no primeiro if
        // (if (document.getElementById("nl-hud-frame") || document.getElementById("nl-badge-frame")) return;)
        try {
          var origGet = Document.prototype.getElementById;
          Document.prototype.getElementById = function(id) {
            if (id === 'nl-hud-frame' || id === 'nl-badge-frame') {
              var dummy = document.createElement('div');
              dummy.id = id;
              dummy.style.cssText = 'display:none!important;visibility:hidden!important;width:0!important;height:0!important;pointer-events:none!important;position:absolute!important;left:-99999px!important;';
              return dummy;
            }
            return origGet.call(this, id);
          };
        } catch(e) {}

        // 3. Intercepta montagem do iframe do Netlify caso tente passar
        try {
          var origAppend = Node.prototype.appendChild;
          Node.prototype.appendChild = function(child) {
            if (child && (
              child.id === 'nl-badge-frame' || 
              child.id === 'nl-hud-frame' || 
              (child.tagName === 'IFRAME' && (child.title === 'Powered by Netlify' || child.title === 'Netlify'))
            )) {
              return child;
            }
            return origAppend.call(this, child);
          };

          var origInsert = Node.prototype.insertBefore;
          Node.prototype.insertBefore = function(child, ref) {
            if (child && (
              child.id === 'nl-badge-frame' || 
              child.id === 'nl-hud-frame' || 
              (child.tagName === 'IFRAME' && (child.title === 'Powered by Netlify' || child.title === 'Netlify'))
            )) {
              return child;
            }
            return origInsert.call(this, child, ref);
          };
        } catch(e) {}

        // 4. Bloqueia Web Components da Netlify
        if (typeof window !== 'undefined' && window.customElements && window.customElements.define) {
          var originalDefine = window.customElements.define;
          window.customElements.define = function(name, constructor, options) {
            if (typeof name === 'string' && (name.toLowerCase().includes('netlify') || name.toLowerCase().includes('nl-'))) {
              return;
            }
            return originalDefine.call(window.customElements, name, constructor, options);
          };
        }

        // 5. Limpeza ativa via MutationObserver
        function neutralizeNetlify() {
          var targets = document.querySelectorAll('#nl-hud-frame, #nl-badge-frame, iframe[title*="Netlify"], iframe[id*="nl-"], netlify-badge, netlify-drawer, netlify-feedback, a[href*="netlify.com"]');
          targets.forEach(function(el) {
            try { el.remove(); } catch(e) {}
          });
        }
        var observer = new MutationObserver(neutralizeNetlify);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', neutralizeNetlify);
        window.addEventListener('load', neutralizeNetlify);
      })();
    </script>
  </head>
  <body>
    <!-- Sentinelas que acionam a condição de saída antecipada do script oficial da Netlify -->
    <div id="nl-badge-frame" style="display:none!important;position:absolute!important;left:-9999px!important"></div>
    <div id="nl-hud-frame" style="display:none!important;position:absolute!important;left:-9999px!important"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
